<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UAI Smart Export</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <h1>UAI Smart Export</h1>
    <div id="project" class="muted">No project</div>
  </div>
  <div class="hright"><span id="ver" class="muted"></span><button id="refresh" class="ghost" title="Re-read the timeline">Refresh</button></div>
</header>

<div id="update" class="update" hidden>
  <span id="updatetext"></span>
  <button id="updatebtn">Update now</button>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="export" class="on">Export</button>
  <button data-tab="grade">Grade</button>
  <button data-tab="review">Review</button>
  <button data-tab="setup">Setup</button>
</nav>

<div class="tab" id="tab-export">
<section>
  <label class="cap">Export folder</label>
  <div id="outdir" class="path" title=""></div>
  <div class="row">
    <button id="browse">Browse…</button>
    <button id="reveal" class="ghost">Open folder</button>
    <button id="resetdir" class="ghost">Use Final Output</button>
  </div>
</section>

<section>
  <label class="cap">What to export</label>
  <div class="seg" id="scope">
    <button data-v="all" class="on">All sequences</button>
    <button data-v="active">Active sequence</button>
    <button data-v="selected">Selected clips</button>
  </div>
  <div class="row opts">
    <label>Max file size <input id="capgb" type="number" min="0.2" step="0.1" value="2"> GB</label>
    <label>Max <input id="capmbps" type="number" min="5" step="5" value="200"> Mbps</label>
  </div>
  <div class="row opts">
    <label><input id="replace" type="checkbox"> Replace existing files</label>
    <label><input id="autostart" type="checkbox"> Start queue automatically</label>
  </div>
</section>

<section class="grow">
  <div class="cap"><span id="count">0 clips</span><span id="summary" class="muted"></span></div>
  <div id="list"></div>
</section>

<footer>
  <button id="go" class="primary" disabled>Export all</button>
  <button id="sizecheck" class="ghost">Check exported files</button>
  <div id="status" class="muted"></div>
</footer>
</div>

<div class="tab" id="tab-grade" hidden>
  <section>
    <label class="cap">Adjust</label>
    <div class="seg" id="gscope">
      <button data-v="selected" class="on">Selected clips</button>
      <button data-v="all">All clips in sequence</button>
    </div>
    <div id="gtarget" class="muted note"></div>
  </section>
  <section>
    <div id="gparams"></div>
  </section>
  <section>
    <label class="cap">Copy grade</label>
    <div class="row">
      <button id="gcopy">Copy from selected clip</button>
    </div>
    <div id="gclip" class="muted note">Nothing copied yet.</div>
    <div class="row">
      <button id="gpaste" disabled>Paste to selected</button>
      <button id="gpastecam" disabled>Paste to same camera</button>
    </div>
  </section>
  <footer><div id="gstatus" class="muted"></div></footer>
</div>

<div class="tab" id="tab-review" hidden>
  <section>
    <label class="cap">Review markers</label>
    <div class="row">
      <button id="rprev">Previous</button>
      <button id="rnext">Next</button>
      <label><input id="rall" type="checkbox"> Show every IN / OUT marker</label>
    </div>
  </section>
  <section class="grow">
    <div id="rlist"></div>
  </section>
  <section>
    <label class="cap">IN / OUT stills (active sequence)</label>
    <div class="seg" id="sscope">
      <button data-v="selected" class="on">Selected clips</button>
      <button data-v="review">Review clips</button>
      <button data-v="all">All clips</button>
    </div>
    <div class="row opts">
      <button id="rstills">Save stills</button>
      <button id="ropen" class="ghost">Open folder</button>
    </div>
  </section>
  <footer><div id="rstatus" class="muted"></div></footer>
</div>

<div class="tab" id="tab-setup" hidden>
  <section>
    <label class="cap">Project panel</label>
    <div class="row"><button id="scolumns">Apply S-log columns</button></div>
    <div class="muted note">Shows Label, Name, Frame Rate, Video Duration and Video Info. To sort, click the Video Info column header until the arrow points down.</div>
  </section>
  <footer><div id="sstatus" class="muted"></div></footer>
</div>
<script src="main.js"></script>
</body>
</html>
