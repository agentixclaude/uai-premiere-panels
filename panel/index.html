<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UAI Smart Export</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <h1>UAI Smart Export</h1>
    <div class="sub"><span id="project">No project</span><span id="acchip" class="chip" hidden></span></div>
  </div>
  <div class="hright"><span id="ver" class="ver"></span><button id="refresh" class="ghost" title="Re-read the timeline">Refresh</button></div>
</header>

<div id="update" class="update" hidden>
  <span id="updatetext"></span>
  <button id="updatebtn">Update now</button>
</div>

<main class="tab" id="tab-export">
  <section>
    <div class="cap"><span>Export to</span><button id="resetdir" class="link end" title="Go back to the client's Final Output folder">Use Final Output</button></div>
    <div class="dir">
      <div id="outdir" class="path" title=""></div>
      <button id="browse" title="Choose another folder">Change…</button>
      <button id="reveal" class="ghost" title="Open the folder in Finder">Open</button>
    </div>
  </section>

  <section>
    <div class="seg" id="scope">
      <button data-v="all" class="on">All sequences</button>
      <button data-v="active">Active sequence</button>
      <button data-v="selected">Selected clips</button>
    </div>
    <div class="row opts">
      <label>Max <input id="capgb" type="number" min="0.2" step="0.1" value="2"> GB</label>
      <label>Max <input id="capmbps" type="number" min="5" step="5" value="200"> Mbps</label>
      <label><input id="replace" type="checkbox"> Replace existing</label>
      <label><input id="autostart" type="checkbox"> Start queue</label>
    </div>
  </section>

  <section class="grow">
    <div class="cap"><span id="count">0 clips</span><span id="summary" class="end"></span></div>
    <div id="list" class="list"></div>
  </section>

  <footer>
    <div class="actions">
      <button id="go" class="primary" disabled>Export all</button>
      <button id="sizecheck" class="second" title="Check every file in the export folder: is it there, and is it under the size cap?">Final Output</button>
    </div>
    <div id="status" class="status"></div>
  </footer>
</main>
<script src="main.js"></script>
</body>
</html>
